mcp_port: 15720

# 只运行 obstacle：关闭 agent-core 注册心跳
register: false

plugins:
  asr:
    enabled: false

  tts:
    enabled: false   # obstacle 镜像不含 TTS 模型
    model_dir: /models/vits2-mix
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: false

  vop:
    enabled: false

  obstacle:
    enabled: true
    model_dir: /models/obstacle
    indoor:
      engine: depth_anything_v2_metric_hypersim_vits_int8.trt
      calib: calib_isotonic_d_roi_min.json
    outdoor:
      depth_engine: yolo26n-depth_int8.trt
      seg_engine: yolo26n-seg_fp16.trt
      allowed_classes: [0, 1, 2, 3, 5, 7]
      min_confidence: 0.25
      percentile: 5.0
      min_depth_m: 0.3
      max_depth_m: 80.0
      offset_m: 1.0
      scale: 1.15
      bias: -1.5
      fallback_distance_m: 3.0
